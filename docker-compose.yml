services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: gassense
      MYSQL_USER: gassense
      MYSQL_PASSWORD: gassense
      MYSQL_ROOT_PASSWORD: root
    ports: ["3307:3306"]
    volumes: ["gassense_mysql:/var/lib/mysql"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "gassense", "-pgassense"]
      interval: 5s
      timeout: 5s
      retries: 20
volumes:
  gassense_mysql:
